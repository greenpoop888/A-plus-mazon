name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            sudo yum install -y git python3.11 python3.11-devel python3.11-pip || true
            cd ~

            if [ ! -d "project" ]; then
              echo "Project not found, cloning..."
              git clone git@github.com:seattle-university-cs-cloud-computing/homework-series-xinrou-xiao.git project
              python3.11 -m venv ~/project/server/venv
            fi

            cd ~/project/server
            git reset --hard origin/main
            git pull

            source ~/project/server/venv/bin/activate
            pip install -r requirements.txt

            pkill -f "uvicorn main:app" || true
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 > ~/uvicorn.log 2>&1 &

            echo "FastAPI restarted successfully"
          EOF


