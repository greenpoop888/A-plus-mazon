name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH to EC2
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            if ! command -v git &> /dev/null; then
                sudo yum install -y git
            fi

            if ! command -v python3.11 &> /dev/null; then
                echo "Python 3.11 not found, installing..."
                sudo yum update -y
                sudo yum install -y python3.11 python3.11-devel python3.11-pip
            else
                echo "Python 3.11 already installed"
            fi

            if [ ! -d "~/project" ]; then
                git clone git@github.com:seattle-university-cs-cloud-computing/homework-series-xinrou-xiao.git ~/project
            fi
            cd ~/project/server

            if [ ! -d "~/project/server/venv" ]; then
                python3.11 -m venv ~/project/server/venv
            fi

            source ~/project/server/venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            pkill -f "uvicorn main:app" || true

            nohup uvicorn main:app --host 0.0.0.0 --port 8000 > ~/uvicorn.log 2>&1 &

            echo "FastAPI restarted successfully"

          EOF
